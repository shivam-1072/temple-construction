apiVersion: apps/v1
kind: Deployment
metadata: { name: temple-backend, namespace: temple-site }
spec:
  replicas: 2
  selector: { matchLabels: { app: temple-backend } }
  template:
    metadata: { labels: { app: temple-backend } }
    spec:
      containers:
        - name: api
          image: ghcr.io/YOUR_ORG/temple-nirman-website-backend:latest
          ports: [{ containerPort: 3001 }]
          env:
            - { name: PORT, value: "3001" }
            - { name: CORS_ORIGIN, value: "https://example.com" }
          volumeMounts: [{ name: data, mountPath: /app/data }]
      volumes: [{ name: data, persistentVolumeClaim: { claimName: temple-data } }]
---
apiVersion: v1
kind: Service
metadata: { name: temple-backend, namespace: temple-site }
spec:
  selector: { app: temple-backend }
  ports: [{ port: 3001, targetPort: 3001 }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: temple-data, namespace: temple-site }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 2Gi } }
